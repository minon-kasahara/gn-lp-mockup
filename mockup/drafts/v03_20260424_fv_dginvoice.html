<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G&N FV — lp.dginvoice.jp 準拠｜信頼バッジ×3Dバブル訴求</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:   #0D1B2E;
      --navy2:  #1A304C;
      --blue:   #2A7BC8;
      --blue-lt:#EAF3FC;
      --accent: #2AAEDD;
      --sub:    #4A6A8A;
      --white:  #FFFFFF;
      --bg:     #F0F6FC;
      --max-w:  1140px;
      --font-ja:'Noto Sans JP', sans-serif;
      --font-en:'Inter', sans-serif;
    }
    body { font-family: var(--font-ja); color: var(--navy); background: var(--bg); -webkit-font-smoothing: antialiased; }

    /* HEADER */
    .hd { position: fixed; inset: 0 0 auto; z-index: 100; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: var(--white); border-bottom: 1px solid #D0E4F5; }
    .hd-logo { font-family: var(--font-en); font-size: 19px; font-weight: 800; color: var(--navy); letter-spacing: -.01em; }
    .hd-nav { display: flex; align-items: center; gap: 24px; }
    .hd-nav a { font-size: 13px; font-weight: 500; color: var(--sub); text-decoration: none; }
    .hd-login { font-size: 13px; font-weight: 600; color: var(--navy); border: 1px solid #C0D8EE; padding: 6px 16px; border-radius: 4px; text-decoration: none; transition: background .2s; }
    .hd-login:hover { background: var(--blue-lt); }
    .hd-partner { font-size: 13px; font-weight: 700; background: var(--accent); color: var(--white); padding: 7px 18px; border-radius: 4px; text-decoration: none; transition: opacity .2s; }
    .hd-partner:hover { opacity: .88; }

    /* HERO */
    .hero { min-height: 100vh; padding-top: 56px; display: flex; align-items: center; background: var(--bg); position: relative; overflow: hidden; }
    .hero-bg-shape { position: absolute; top: 0; right: 0; width: 55%; height: 100%; background: linear-gradient(160deg, #DDEEFA 0%, #C8E4F8 100%); clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%); pointer-events: none; }

    .inner { position: relative; z-index: 1; max-width: var(--max-w); margin: 0 auto; padding: 48px 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; width: 100%; }

    /* LEFT */

    /* 信頼バッジ（dginvoice 最上部の "東証プライム上場企業運営" に相当） */
    .trust-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--blue); color: var(--white); font-size: 12px; font-weight: 700; padding: 6px 16px; border-radius: 4px; margin-bottom: 20px; }
    .trust-badge::before { content: '👍'; font-size: 13px; }

    h1 { font-size: 48px; font-weight: 900; line-height: 1.25; letter-spacing: -.02em; color: var(--navy); margin-bottom: 8px; }
    .h1-sub { font-size: 28px; font-weight: 900; color: var(--navy); margin-bottom: 20px; letter-spacing: -.01em; }
    /* 強調枠（dginvoice の「最大60日延長」枠に相当） */
    .h1-highlight { display: inline-block; border: 2.5px solid var(--accent); color: var(--accent); font-size: 32px; font-weight: 900; padding: 4px 16px; margin: 8px 0 16px; letter-spacing: -.01em; border-radius: 4px; }

    .cta-count { font-size: 13px; color: var(--sub); margin-bottom: 20px; font-weight: 500; }
    .cta-count strong { color: var(--navy); font-weight: 900; font-size: 16px; }

    .cta-pair { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn-main { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: var(--white); font-size: 15px; font-weight: 700; padding: 14px 28px; border-radius: 4px; text-decoration: none; box-shadow: 0 6px 18px rgba(42,174,221,.38); transition: opacity .2s; }
    .btn-main:hover { opacity: .88; }
    .btn-main::after { content: '→'; }
    .btn-outline { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--white); color: var(--navy); font-size: 15px; font-weight: 700; padding: 14px 28px; border-radius: 4px; text-decoration: none; border: 1.5px solid #C0D8EE; transition: background .2s; }
    .btn-outline:hover { background: var(--blue-lt); }
    .btn-outline::after { content: '→'; }

    .cert { margin-top: 16px; font-size: 11.5px; color: var(--sub); display: flex; align-items: center; gap: 6px; }
    .cert::before { content: '✓'; color: var(--accent); font-weight: 700; }

    /* RIGHT — 3Dバブル（dginvoice再現） */
    .bubbles-wrap { display: flex; flex-direction: column; gap: 16px; }

    /* 上段：3つのバブル（特徴訴求） */
    .bubbles-row { display: flex; gap: 14px; justify-content: center; }
    .bubble {
      background: var(--white);
      border-radius: 50%;
      width: 130px; height: 130px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      box-shadow: 0 8px 28px rgba(13,27,46,.12), 0 2px 8px rgba(42,174,221,.1);
      border: 1px solid rgba(255,255,255,.9);
      padding: 12px;
      position: relative;
      transition: transform .2s;
    }
    .bubble:hover { transform: translateY(-4px); }
    .bubble-num { font-family: var(--font-en); font-size: 28px; font-weight: 900; color: var(--navy); line-height: 1; letter-spacing: -.03em; }
    .bubble-unit { font-size: 13px; font-weight: 700; color: var(--navy); }
    .bubble-desc { font-size: 10.5px; color: var(--sub); margin-top: 4px; line-height: 1.3; font-weight: 500; }

    /* バブル大きさバリエーション */
    .bubble.lg { width: 150px; height: 150px; }
    .bubble.lg .bubble-num { font-size: 36px; }

    /* 下段：実績グリッド */
    .stats-card { background: var(--white); border-radius: 10px; padding: 20px 24px; box-shadow: 0 4px 16px rgba(13,27,46,.08); border: 1px solid #D0E4F5; }
    .sc-title { font-family: var(--font-en); font-size: 10.5px; font-weight: 700; letter-spacing: .1em; color: var(--accent); margin-bottom: 14px; }
    .sc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; text-align: center; }
    .sc-n { font-family: var(--font-en); font-size: 22px; font-weight: 800; color: var(--navy); line-height: 1; letter-spacing: -.02em; }
    .sc-n sup { font-size: 12px; }
    .sc-l { font-size: 10.5px; color: var(--sub); margin-top: 3px; }

    .label { position: fixed; bottom: 14px; right: 14px; background: var(--navy); color: #fff; font-family: var(--font-en); font-size: 10.5px; padding: 6px 12px; border-radius: 6px; opacity: .65; z-index: 999; }
  </style>
</head>
<body>
<header class="hd">
  <div class="hd-logo">G&amp;N</div>
  <nav class="hd-nav">
    <a href="#">サービス</a><a href="#">選ばれる理由</a><a href="#">お客様事例</a><a href="#">よくある質問</a>
  </nav>
  <div style="display:flex;gap:10px;">
    <a href="#" class="hd-login">ログイン</a>
    <a href="#" class="hd-partner">協業パートナー募集</a>
  </div>
</header>

<section class="hero">
  <div class="hero-bg-shape"></div>
  <div class="inner">
    <div>
      <div class="trust-badge">認定経営革新等支援機関として安心</div>
      <h1>挑戦するスタートアップに、<br>補助金という追い風を。</h1>
      <div class="h1-highlight">VC紹介先は着手金0円</div>
      <div class="cta-count">支援実績 <strong>1,200社突破</strong></div>
      <div class="cta-pair">
        <a href="#" class="btn-main">まずは無料相談する</a>
        <a href="#" class="btn-outline">資料ダウンロード</a>
      </div>
      <div class="cert">1時間で最適な制度を提案します</div>
    </div>

    <div class="bubbles-wrap">
      <div class="bubbles-row">
        <div class="bubble lg">
          <div class="bubble-num">50<span class="bubble-unit">社+</span></div>
          <div class="bubble-desc">提携VC数</div>
        </div>
        <div class="bubble">
          <div class="bubble-num">0<span class="bubble-unit">円</span></div>
          <div class="bubble-desc">VC紹介先<br>着手金</div>
        </div>
        <div class="bubble">
          <div class="bubble-num">9<span class="bubble-unit">年</span></div>
          <div class="bubble-desc">支援実績<br>年数</div>
        </div>
      </div>
      <div class="stats-card">
        <div class="sc-title">TRACK RECORD</div>
        <div class="sc-grid">
          <div><div class="sc-n">1,200<sup>社</sup></div><div class="sc-l">補助金支援</div></div>
          <div><div class="sc-n">800<sup>件</sup></div><div class="sc-l">採択件数</div></div>
          <div><div class="sc-n">200<sup>億</sup></div><div class="sc-l">総調達額</div></div>
          <div><div class="sc-n">279<sup>件</sup></div><div class="sc-l">ものづくり</div></div>
        </div>
      </div>
    </div>
  </div>
</section>
<div class="label">準拠: lp.dginvoice.jp — 信頼バッジ×3Dバブル訴求</div>
</body>
</html>
