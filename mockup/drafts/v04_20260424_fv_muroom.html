<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G&N FV v04 — muroom準拠｜超ミニマル・full-screen</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#181D2A; --sub:#7A879B;
  --blob-a:rgba(226,165,195,.35); --blob-b:rgba(132,178,222,.32);
  --line:rgba(24,29,42,.08);
  --white:#fff;
  --ja:'Noto Sans JP',sans-serif; --en:'Inter',sans-serif;
}
body{font-family:var(--ja);color:var(--ink);background:var(--white);-webkit-font-smoothing:antialiased;overflow-x:hidden}

.hd{position:fixed;inset:0 0 auto;z-index:100;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;background:transparent}
.hd-logo{display:flex;align-items:center;gap:14px;color:var(--ink);font-family:var(--en);font-size:12px;font-weight:400;letter-spacing:.06em}
.hd-logo .logo-svg{height:26px;width:auto;display:block}
.hd-logo span{color:var(--sub);font-weight:300}
.hd-nav{display:flex;gap:40px}
.hd-nav a{font-size:12.5px;font-weight:400;color:var(--sub);text-decoration:none;letter-spacing:.08em}
.hd-contact{font-size:12.5px;font-weight:500;color:var(--ink);text-decoration:none;letter-spacing:.08em;border-bottom:1px solid var(--ink);padding-bottom:2px}

/* HERO：白一色・余白最大限 */
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:100px 40px 40px}

/* 単独の大ブロブ */
.mega-blob{position:absolute;pointer-events:none;z-index:0}
.mb-1{width:640px;height:520px;background:radial-gradient(ellipse,var(--blob-a) 0%,transparent 65%);border-radius:58% 42% 60% 40%/52% 48% 52% 48%;top:-6%;right:-10%;filter:blur(3px)}
.mb-2{width:520px;height:440px;background:radial-gradient(ellipse,var(--blob-b) 0%,transparent 65%);border-radius:42% 58% 48% 52%/55% 45% 55% 45%;bottom:-10%;left:-8%;filter:blur(4px)}

.center{position:relative;z-index:1;max-width:820px;text-align:left}
.eyebrow{font-family:var(--en);font-size:11px;font-weight:500;letter-spacing:.22em;color:var(--sub);margin-bottom:44px;text-transform:uppercase;display:flex;align-items:center;gap:14px}
.eyebrow::before{content:'';width:28px;height:1px;background:var(--sub)}

h1{font-size:68px;font-weight:900;line-height:1.18;letter-spacing:-.035em;color:var(--ink);margin-bottom:44px}

.sub{font-size:15px;line-height:2.1;color:var(--sub);font-weight:300;max-width:500px;margin-bottom:64px}

/* 超控えめCTA（テキストリンク風・大きい） */
.cta-link{display:inline-flex;align-items:center;gap:16px;color:var(--ink);font-size:15px;font-weight:500;text-decoration:none;padding:4px 0;border-bottom:1px solid var(--ink);letter-spacing:.04em}
.cta-link span{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px;margin-left:8px;transition:transform .3s}
.cta-link:hover span{transform:translateX(4px)}

/* 下部ミニ情報ストライプ */
.footer-strip{position:absolute;bottom:0;left:0;right:0;padding:28px 56px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--sub);font-weight:300;letter-spacing:.06em;background:rgba(255,255,255,.6);backdrop-filter:blur(6px)}
.fs-stats{display:flex;gap:32px}
.fs-stats span strong{font-family:var(--en);font-weight:700;color:var(--ink);font-size:13px;margin-right:4px}

.label{position:fixed;bottom:14px;right:14px;background:var(--ink);color:#fff;font-family:var(--en);font-size:10.5px;padding:6px 12px;border-radius:4px;opacity:.7;z-index:999;letter-spacing:.04em}
</style>
</head>
